# CI only (I65), not for merge: I65's tests (tests_m3/test_o12.py, one job per prediction or class) and the suites its
# final head can move (contracts, M3's derivation, I66's view evidence, I32's profiles, M2's evidence, filter and exit),
# one job per tests_m3 module and per tests_m2 group, at the commit .github/ci-ref names (else this one), each job's log
# uploaded and a summary job collecting every job's last lines. The branch deletes holon-ci.yml, so nothing runs twice.
name: holon-i65-suites

on:
  push:
    branches: ['claude/brave-wright-2c5d0o-ci-i65-suites*']

permissions:
  contents: read

concurrency:
  group: holon-i65-suites-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13.16'
  NODE_VERSION: '22.22.0'
  GO_VERSION: '1.24.7'
  BEND_NO_TELEMETRY: '1'

jobs:
  toolchain:
    name: toolchain (install + verify pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache key from the pins
        id: key
        run: echo "key=holon-toolchain-v1-${{ hashFiles('config/holon.json', 'tools/install_bend.sh', '.github/ci/install_toolchain.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: restore
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Install the pinned toolchain
        if: steps.restore.outputs.cache-hit != 'true'
        run: bash .github/ci/install_toolchain.sh
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work

  run:
    name: ${{ matrix.name }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: o12-instrument-ghost
            mods: tests_m3.test_o12.TestInstrument tests_m3.test_o12.TestGhost
          - name: o12-contract
            mods: tests_m3.test_o12.TestContract
          - name: o12-p1-p2
            mods: tests_m3.test_o12.TestPredictions.test_p1_the_l_weak_is_proved_by_trace_bound tests_m3.test_o12.TestPredictions.test_p2_the_mark_lands_on_the_view_record_alone
          - name: o12-p3
            mods: tests_m3.test_o12.TestPredictions.test_p3_a_false_bound_is_refuted_and_marks_nothing
          - name: o12-p4
            mods: tests_m3.test_o12.TestPredictions.test_p4_a_view_change_needs_a_new_proof
          - name: o12-machinery
            mods: tests_m3.test_o12.TestMachinery
          - name: o12-r1
            mods: tests_m3.test_o12.TestRegressions.test_r1_g10_on_every_milestone
          - name: o12-r2-r3
            mods: tests_m3.test_o12.TestRegressions.test_r2_records_and_laws_change_only_as_allowed tests_m3.test_o12.TestRegressions.test_r3_no_frozen_root_and_no_m3_generated_file
          - name: m3-contracts
            mods: tests_m3.test_contracts
          - name: m3-derive_par
            mods: tests_m3.test_derive_par
          - name: m3-undo
            mods: tests_m3.test_undo
          - name: m2-group2
            mods: tests_m2.test_diagram_review tests_m2.test_evidence tests_m2.test_evidence_fixture tests_m2.test_evidence_gate tests_m2.test_evidence_honesty tests_m2.test_extract_go tests_m2.test_extract_go_honesty tests_m2.test_extract_go_toy tests_m2.test_extract_solidity_honesty tests_m2.test_extract_solidity_layout tests_m2.test_extract_solidity_toy
          - name: m2-group3
            mods: tests_m2.test_extract_toolchain tests_m2.test_extract_transitions tests_m2.test_extracted_refinement tests_m2.test_filter tests_m2.test_gate_g1_g6_g9 tests_m2.test_gate_ir03 tests_m2.test_gate_m2_outputs tests_m2.test_historical tests_m2.test_historical_exit tests_m2.test_historical_offline tests_m2.test_i19_followup
          - name: m3-view_evidence
            mods: tests_m3.test_view_evidence
          - name: m3-disch_profile
            mods: tests_m3.test_disch_profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit under test
        run: |
          if [ -f .github/ci-ref ]; then REF=$(cat .github/ci-ref); git checkout -q "$REF"; fi
          git log -1 --format='%H %s'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Python requirements
        run: python -m pip install -q --require-hashes --no-deps -r .github/ci/requirements-ci.txt
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - name: Run
        env:
          MODS: ${{ matrix.mods }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          python -u -m unittest $MODS -v > "$RUNNER_TEMP/out/log.txt" 2>&1
          echo "exit $?" >> "$RUNNER_TEMP/out/log.txt"
          tail -5 "$RUNNER_TEMP/out/log.txt"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: log-${{ matrix.name }}
          retention-days: 7
          path: ${{ runner.temp }}/out/

  summary:
    name: summary
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: 'log-*'
          path: logs
      - name: Summarize
        run: |
          mkdir -p sum
          for d in logs/*/; do
            n=$(basename "$d")
            { echo "== $n"; grep -E '^(FAIL|ERROR): |^Ran [0-9]+ tests|^(OK|FAILED)|^exit ' "$d/log.txt" || echo "(no log)"; } >> sum/summary.txt
          done
          cat sum/summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: summary
          retention-days: 7
          path: sum/
