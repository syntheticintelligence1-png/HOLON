# CI only (i46-blind-2), not for merge: holon land plan's re-make of 115 dirty M3 laws, then the final filter; the publish job pushes every job's files to claude/ci-i46-blind-2-out-<run id>.
name: holon-i46-blind-2

on:
  push:
    branches: ['claude/ci-i46-blind-2']

permissions:
  contents: read

concurrency:
  group: holon-i46-blind-2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13.16'
  NODE_VERSION: '22.22.0'
  GO_VERSION: '1.24.7'
  BEND_NO_TELEMETRY: '1'

jobs:
  toolchain:
    name: toolchain (install + verify pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache key from the pins
        id: key
        run: echo "key=holon-toolchain-v1-${{ hashFiles('config/holon.json', 'tools/install_bend.sh', '.github/ci/install_toolchain.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: restore
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Install the pinned toolchain
        if: steps.restore.outputs.cache-hit != 'true'
        run: bash .github/ci/install_toolchain.sh
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
  run:
    name: ${{ matrix.name }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: disch-0
            laws: L_disch_blk_initializable_120_b8d46c45_anyone,L_disch_blk_rollup_132_d953872f_caller_rollup_210,L_disch_blk_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_noext_pausableupgradeable_77_ed0ce816_onlyOwner,L_disch_rev_initializable_120_b95c70f1
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-1
            laws: L_disch_blk_initializable_120_b95c70f1_anyone,L_disch_blk_rollup_132_d953872f_onlyActiveSubmitter,L_disch_ext_pausableupgradeable_77_ed0ce816_onlyOwner,L_disch_noext_rollup_132_d953872f_onlyOwner,L_disch_rev_initializable_120_d9a34b48
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-2
            laws: L_disch_blk_initializable_120_d9a34b48_caller_rollup_210,L_disch_blk_rollup_132_d953872f_onlyChallenger,L_disch_ext_rollup_132_d953872f_onlyOwner,L_disch_noext_rollup_213_f2e7faf8_onlyActiveSubmitter,L_disch_rev_pausableupgradeable_77_ed0ce816
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-3
            laws: L_disch_blk_pausableupgradeable_77_ed0ce816_anyone,L_disch_blk_rollup_213_f2e7faf8_caller_rollup_210,L_disch_ext_rollup_213_f2e7faf8_onlyActiveSubmitter,L_disch_noext_rollup_213_f2e7faf8_onlyOwner,L_disch_rev_rollup_132_d953872f
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-4
            laws: L_disch_blk_pausableupgradeable_77_ed0ce816_onlyActiveSubmitter,L_disch_blk_rollup_213_f2e7faf8_onlyChallenger,L_disch_ext_rollup_213_f2e7faf8_onlyOwner,L_disch_noext_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_rev_rollup_213_f2e7faf8
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-5
            laws: L_disch_blk_pausableupgradeable_77_ed0ce816_onlyChallenger,L_disch_blk_rollup_228_79cc3e9a_onlyOwner,L_disch_ext_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_noext_rollup_363_e11d8bb2_onlyOwner,L_disch_rev_rollup_228_79cc3e9a
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: disch-6
            laws: L_disch_blk_rollup_132_d953872f_anyone,L_disch_blk_rollup_363_e11d8bb2_anyone,L_disch_ext_rollup_363_e11d8bb2_onlyOwner,L_disch_rev_initializable_120_b8d46c45,L_disch_rev_rollup_363_e11d8bb2
            extra: '--law-timebox 540 --deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: fact-attr-0
            laws: L_fact_attr_Rollup_commitBatchWithProof_batchBlobVersionedHashes_batchDataStore_submitter
            extra: '--deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: fact-attr-1
            laws: L_fact_attr_Rollup_commitState_batchBlobVersionedHashes_batchDataStore_submitter
            extra: '--deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: fact-kernel
            laws: L_fact_kernel_Rollup_commitBatchWithProof_committedBatches_blobhash,L_fact_kernel_Rollup_commitBatch_committedBatches_blobhash,L_fact_kernel_Rollup_commitState_committedBatches_blobhash
            extra: ''
            lean: ''
            cmd: ''
          - name: own
            laws: L_own_alias_batch_BatchData_TxsPayloadV2_Append,L_own_alias_batch_BatchData_TxsPayloadV2_TxsPayloadV2,L_own_alias_batch_BatchData_TxsPayload_Append,L_own_alias_batch_BatchData_TxsPayload_EstimateCompressedSizeWithNewPayload,L_own_lost_batch_BatchHeaderV0_Bytes_EncodedBytes,L_own_lost_batch_BatchHeaderV1_Bytes_EncodedBytes
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-0
            laws: L_sym_omega_Rollup_addChallenger_challengeState,L_sym_omega_Rollup_commitBatchWithProof_commitState,L_sym_omega_Rollup_commitBatch_updateProofWindow,L_sym_omega_Rollup_proveState_setPause
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-1
            laws: L_sym_omega_Rollup_challengeState_commitBatch,L_sym_omega_Rollup_commitBatchWithProof_importGenesisBatch,L_sym_omega_Rollup_commitBatch_updateRollupDelayPeriod,L_sym_omega_Rollup_proveState_updateProofWindow
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-2
            laws: L_sym_omega_Rollup_challengeState_commitBatchWithProof,L_sym_omega_Rollup_commitBatchWithProof_proveState,L_sym_omega_Rollup_commitState_finalizeBatch,L_sym_omega_Rollup_proveState_updateRewardPercentage
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-3
            laws: L_sym_omega_Rollup_challengeState_commitState,L_sym_omega_Rollup_commitBatchWithProof_revertBatch,L_sym_omega_Rollup_commitState_importGenesisBatch,L_sym_omega_Rollup_proveState_updateVerifier
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-4
            laws: L_sym_omega_Rollup_challengeState_finalizeBatch,L_sym_omega_Rollup_commitBatchWithProof_setPause,L_sym_omega_Rollup_commitState_revertBatch,L_sym_pi_Rollup_batchInChallenge_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-5
            laws: L_sym_omega_Rollup_challengeState_importGenesisBatch,L_sym_omega_Rollup_commitBatchWithProof_updateFinalizePeriodSeconds,L_sym_omega_Rollup_commitState_setPause,L_sym_pi_Rollup_challengeState_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-6
            laws: L_sym_omega_Rollup_challengeState_proveState,L_sym_omega_Rollup_commitBatchWithProof_updateProofWindow,L_sym_omega_Rollup_commitState_updateFinalizePeriodSeconds,L_sym_pi_Rollup_commitBatchWithProof_submitter
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-7
            laws: L_sym_omega_Rollup_challengeState_removeChallenger,L_sym_omega_Rollup_commitBatchWithProof_updateRollupDelayPeriod,L_sym_omega_Rollup_commitState_updateProofWindow,L_sym_pi_Rollup_commitBatch_submitter
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-8
            laws: L_sym_omega_Rollup_challengeState_revertBatch,L_sym_omega_Rollup_commitBatchWithProof_updateVerifier,L_sym_omega_Rollup_commitState_updateRollupDelayPeriod,L_sym_pi_Rollup_commitState_submitter
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-9
            laws: L_sym_omega_Rollup_challengeState_setPause,L_sym_omega_Rollup_commitBatch_commitBatchWithProof,L_sym_omega_Rollup_finalizeBatch_importGenesisBatch,L_sym_pi_Rollup_finalizeBatch_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-10
            laws: L_sym_omega_Rollup_challengeState_updateProofWindow,L_sym_omega_Rollup_commitBatch_finalizeBatch,L_sym_omega_Rollup_finalizeBatch_proveState,L_sym_pi_Rollup_importGenesisBatch_submitter
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-11
            laws: L_sym_omega_Rollup_claimProveRemaining_proveState,L_sym_omega_Rollup_commitBatch_importGenesisBatch,L_sym_omega_Rollup_finalizeBatch_revertBatch,L_sym_pi_Rollup_proveState_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-12
            laws: L_sym_omega_Rollup_claimReward_proveState,L_sym_omega_Rollup_commitBatch_revertBatch,L_sym_omega_Rollup_finalizeBatch_setPause,L_sym_pi_Rollup_proveState_submitter
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-13
            laws: L_sym_omega_Rollup_claimReward_revertBatch,L_sym_omega_Rollup_commitBatch_setPause,L_sym_omega_Rollup_importGenesisBatch_proveState,L_sym_pi_Rollup_revertBatch_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: sym-14
            laws: L_sym_omega_Rollup_claimReward_setPause,L_sym_omega_Rollup_commitBatch_updateFinalizePeriodSeconds,L_sym_omega_Rollup_proveState_revertBatch,L_sym_pi_Rollup_setPause_challenger
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-cancel
            laws: L_undo_cancel_Rollup_challengeState_setPause
            extra: '--deadline @DEADLINE@'
            lean: ''
            cmd: ''
          - name: undo-pair-2
            laws: L_undo_pair_Rollup_addChallenger_removeChallenger
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-pair-3
            laws: L_undo_pair_Rollup_commitBatchWithProof_revertBatch
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-pair-4
            laws: L_undo_pair_Rollup_commitBatch_revertBatch
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-pair-5
            laws: L_undo_pair_Rollup_commitState_revertBatch
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-pair-6
            laws: L_undo_pair_Rollup_removeChallenger_addChallenger
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-residue-7
            laws: L_undo_res_Rollup_revertBatch_batchBlobVersionedHashes
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-residue-8
            laws: L_undo_res_Rollup_revertBatch_batchDataStore
            extra: ''
            lean: ''
            cmd: ''
          - name: undo-residue-9
            laws: L_undo_res_Rollup_revertBatch_committedStateRoots
            extra: ''
            lean: ''
            cmd: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Python requirements
        run: python -m pip install -q --require-hashes --no-deps -r .github/ci/requirements-ci.txt
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - name: Run
        env:
          LAWS: ${{ matrix.laws }}
          EXTRA: ${{ matrix.extra }}
          LEAN: ${{ matrix.lean }}
          CMD: ${{ matrix.cmd }}
          HOLON_TRACE: '1'
        run: |
          set -o pipefail
          date -u +"%FT%TZ start" | tee "$RUNNER_TEMP/run.log"
          EXTRA="${EXTRA//@DEADLINE@/$(date -u -d '+300 min' +%FT%TZ)}"
          if [ "$CMD" = "m12" ] || [ "$CMD" = "t32" ]; then
            export HOLON_TRACE=0   # a re-stamp's traces have no consumer, and each re-stamp would rewrite them
          fi
          if [ "$CMD" = "m12" ]; then
            for c in "run --milestone M2" "bind --milestone M2" "lean --milestone M2" "run --milestone M2" "run --milestone M1" "metrics --milestone M1" "metrics --milestone M2"; do
              date -u +"%FT%TZ holon $c" | tee -a "$RUNNER_TEMP/run.log"
              python -u -m holon $c 2>&1 | tee -a "$RUNNER_TEMP/run.log"
            done
          elif [ "$CMD" = "derivation" ]; then
            # I89: I88's derivation law set re-decided with the Bend engine (the product, the equivalence pair, the decisions)
            python -u -m holon derivation bend-decide 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          elif [ "$CMD" = "t32" ]; then
            python -u -m holon profile --milestone T32 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          elif [ "$CMD" = "bundle" ]; then
            # I86's bundle laws: the deciders, then the witnesses on the real bundle (holon bundle replay-laws)
            for c in "run --milestone M3 --laws $LAWS $EXTRA" "bundle replay-laws"; do
              date -u +"%FT%TZ holon $c" | tee -a "$RUNNER_TEMP/run.log"
              python -u -m holon $c 2>&1 | tee -a "$RUNNER_TEMP/run.log"
            done
          elif [ "$CMD" = "bundle2" ]; then
            # I84's bundle laws: the claims modules from the laws' deployment (a forge run), the deciders, the replay
            for c in "bundle2 laws" "run --milestone M3 --laws $LAWS $EXTRA" "bundle2 replay-laws"; do
              date -u +"%FT%TZ holon $c" | tee -a "$RUNNER_TEMP/run.log"
              python -u -m holon $c 2>&1 | tee -a "$RUNNER_TEMP/run.log"
            done
          else
            python -u -m holon run --milestone M3 --laws "$LAWS" $EXTRA 2>&1 | tee -a "$RUNNER_TEMP/run.log"
            if [ -n "$LEAN" ]; then
              date -u +"%FT%TZ lean" | tee -a "$RUNNER_TEMP/run.log"
              python -u -m holon lean --milestone M3 2>&1 | tee -a "$RUNNER_TEMP/run.log"
              date -u +"%FT%TZ run again" | tee -a "$RUNNER_TEMP/run.log"
              python -u -m holon run --milestone M3 --laws "$LAWS" $EXTRA 2>&1 | tee -a "$RUNNER_TEMP/run.log"
            fi
          fi
          date -u +"%FT%TZ end" | tee -a "$RUNNER_TEMP/run.log"
      - name: Collect every changed or added file
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/out/run.log" || true
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/out/status.txt"
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -v '^\.' > "$RUNNER_TEMP/files.txt" || true
          tar -czf "$RUNNER_TEMP/out/changed.tgz" -T "$RUNNER_TEMP/files.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ${{ matrix.name }}-out
          retention-days: 7
          path: ${{ runner.temp }}/out/

  filter:
    name: filter (I40's final filter over every job's records)
    needs: [toolchain, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Python requirements
        run: python -m pip install -q --require-hashes --no-deps -r .github/ci/requirements-ci.txt
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - name: The pinned z3 (hash-pinned wheels, tools/extract-requirements.txt)
        run: bash tools/setup_env.sh --extract
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: '*-out'
          path: ${{ runner.temp }}/jobs
      - name: Apply every job's files, in a fixed order
        run: |
          set -o pipefail
          set -- disch-0 disch-1 disch-2 disch-3 disch-4 disch-5 disch-6 fact-attr-0 fact-attr-1 fact-kernel own sym-0 sym-1 sym-2 sym-3 sym-4 sym-5 sym-6 sym-7 sym-8 sym-9 sym-10 sym-11 sym-12 sym-13 sym-14 undo-cancel undo-pair-2 undo-pair-3 undo-pair-4 undo-pair-5 undo-pair-6 undo-residue-7 undo-residue-8 undo-residue-9
          for j in "$@"; do
            f="$RUNNER_TEMP/jobs/$j-out/changed.tgz"
            if [ ! -f "$f" ] && [ $# -eq 1 ] && [ -f "$RUNNER_TEMP/jobs/changed.tgz" ]; then
              f="$RUNNER_TEMP/jobs/changed.tgz"   # a plan of one job: its one artifact is extracted into jobs/ itself
            fi
            if [ -f "$f" ]; then
              echo "applying $j"
              tar -xzf "$f"
            else
              echo "no files from $j"
            fi
          done
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -v '^\.' | sort > "$RUNNER_TEMP/applied.txt" || true
          wc -l "$RUNNER_TEMP/applied.txt"
      - name: Final filter
        run: |
          set -o pipefail
          python -u -m holon replay-go --milestone M3 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          python -u -m holon refute --milestone M3 --only filter 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          python -u -m holon sym --milestone M3 --aggregate 2>&1 | tee -a "$RUNNER_TEMP/run.log"
      - name: Collect every changed or added file
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/out/run.log" || true
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/out/status.txt"
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -v '^\.' > "$RUNNER_TEMP/files.txt" || true
          tar -czf "$RUNNER_TEMP/out/changed.tgz" -T "$RUNNER_TEMP/files.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: filter-out
          retention-days: 7
          path: ${{ runner.temp }}/out/

  publish:
    name: publish the outputs
    needs: [run, filter]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: '*-out'
          path: out
      - name: Push the outputs (an orphan commit; no repository code runs here)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SRC: ${{ github.sha }}
        run: |
          cd out
          ls -la
          git init -q
          git checkout -q -b results
          git add -A
          git -c user.name=holon-ci -c user.email=holon-ci@users.noreply.github.com commit -q -m "i46-blind-2 re-make of run $RUN at $SRC"
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}" "HEAD:refs/heads/claude/ci-i46-blind-2-out-${RUN}"
