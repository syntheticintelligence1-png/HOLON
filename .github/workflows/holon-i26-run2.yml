# CI only (I26, round 2), not for merge: the I26 outcome run of the five FACT laws (one job per attribution law, one
# for the kernel laws) and the re-made typed SORT and DISCH records (DISCH with I31's per-law time box), each on its own
# GitHub-hosted runner, at this branch's code; the FACT and DISCH searches carry a wall-clock time box five hours after
# their job starts, so a search that has not finished is recorded with it instead of being cut off.
# Every job uploads the files it changed or added; the publish job pushes them, one directory per job, as an orphan
# commit to claude/ci-i26-run2-out-<run id>. The toolchain is the cached one of holon-ci.yml, at the pins in
# config/holon.json.
name: holon-i26-run2

on:
  push:
    branches: ['claude/ci-i26-run-2']

permissions:
  contents: read

concurrency:
  group: holon-i26-run2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13.16'
  NODE_VERSION: '22.22.0'
  GO_VERSION: '1.24.7'
  BEND_NO_TELEMETRY: '1'

jobs:
  toolchain:
    name: toolchain (install + verify pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache key from the pins
        id: key
        run: echo "key=holon-toolchain-v1-${{ hashFiles('config/holon.json', 'tools/install_bend.sh', '.github/ci/install_toolchain.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: restore
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Install the pinned toolchain
        if: steps.restore.outputs.cache-hit != 'true'
        run: bash .github/ci/install_toolchain.sh
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work

  run:
    name: ${{ matrix.name }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fact-attr-proof
            laws: L_fact_attr_Rollup_commitBatchWithProof_batchBlobVersionedHashes_batchDataStore_submitter
            extra: '--deadline @DEADLINE@'
          - name: fact-attr-state
            laws: L_fact_attr_Rollup_commitState_batchBlobVersionedHashes_batchDataStore_submitter
            extra: '--deadline @DEADLINE@'
          - name: fact-kernel
            laws: L_fact_kernel_Rollup_commitBatch_committedBatches_blobhash,L_fact_kernel_Rollup_commitBatchWithProof_committedBatches_blobhash,L_fact_kernel_Rollup_commitState_committedBatches_blobhash
            extra: ''
          - name: typed
            laws: L_sort_realize_rollup_363_4a64383b,L_sort_tag_rollup_279_e01ea84a,L_sort_tag_rollup_406_e01ea84a
            extra: ''
          - name: disch
            laws: L_disch_blk_initializable_120_b8d46c45_anyone,L_disch_blk_initializable_120_b95c70f1_anyone,L_disch_blk_initializable_120_d9a34b48_caller_rollup_210,L_disch_blk_pausableupgradeable_77_ed0ce816_anyone,L_disch_blk_pausableupgradeable_77_ed0ce816_onlyActiveSubmitter,L_disch_blk_pausableupgradeable_77_ed0ce816_onlyChallenger,L_disch_blk_rollup_132_d953872f_anyone,L_disch_blk_rollup_132_d953872f_caller_rollup_210,L_disch_blk_rollup_132_d953872f_onlyActiveSubmitter,L_disch_blk_rollup_132_d953872f_onlyChallenger,L_disch_blk_rollup_213_f2e7faf8_caller_rollup_210,L_disch_blk_rollup_213_f2e7faf8_onlyChallenger,L_disch_blk_rollup_228_79cc3e9a_onlyOwner,L_disch_blk_rollup_363_e11d8bb2_anyone,L_disch_blk_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_ext_pausableupgradeable_77_ed0ce816_onlyOwner,L_disch_ext_rollup_132_d953872f_onlyOwner,L_disch_ext_rollup_213_f2e7faf8_onlyActiveSubmitter,L_disch_ext_rollup_213_f2e7faf8_onlyOwner,L_disch_ext_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_ext_rollup_363_e11d8bb2_onlyOwner,L_disch_noext_pausableupgradeable_77_ed0ce816_onlyOwner,L_disch_noext_rollup_132_d953872f_onlyOwner,L_disch_noext_rollup_213_f2e7faf8_onlyActiveSubmitter,L_disch_noext_rollup_213_f2e7faf8_onlyOwner,L_disch_noext_rollup_363_e11d8bb2_onlyActiveSubmitter,L_disch_noext_rollup_363_e11d8bb2_onlyOwner,L_disch_rev_initializable_120_b8d46c45,L_disch_rev_initializable_120_b95c70f1,L_disch_rev_initializable_120_d9a34b48,L_disch_rev_pausableupgradeable_77_ed0ce816,L_disch_rev_rollup_132_d953872f,L_disch_rev_rollup_213_f2e7faf8,L_disch_rev_rollup_228_79cc3e9a,L_disch_rev_rollup_363_e11d8bb2
            extra: '--law-timebox 540 --deadline @DEADLINE@'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Python requirements
        run: python -m pip install -q --require-hashes --no-deps -r .github/ci/requirements-ci.txt
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - name: Run
        env:
          LAWS: ${{ matrix.laws }}
          EXTRA: ${{ matrix.extra }}
        run: |
          set -o pipefail
          date -u +"%FT%TZ start" | tee "$RUNNER_TEMP/run.log"
          EXTRA="${EXTRA//@DEADLINE@/$(date -u -d '+300 min' +%FT%TZ)}"
          python -u -m holon run --milestone M3 --laws "$LAWS" $EXTRA 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          date -u +"%FT%TZ end" | tee -a "$RUNNER_TEMP/run.log"
      - name: Collect every changed or added file
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/out/run.log" || true
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/out/status.txt"
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -v '^\.' > "$RUNNER_TEMP/files.txt" || true
          tar -czf "$RUNNER_TEMP/out/changed.tgz" -T "$RUNNER_TEMP/files.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ${{ matrix.name }}-out
          retention-days: 7
          path: ${{ runner.temp }}/out/

  publish:
    name: publish the outputs
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: '*-out'
          path: out
      - name: Push the outputs (an orphan commit; no repository code runs here)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SRC: ${{ github.sha }}
        run: |
          cd out
          ls -la
          git init -q
          git checkout -q -b results
          git add -A
          git -c user.name=holon-ci -c user.email=holon-ci@users.noreply.github.com commit -q -m "I26 round-2 runs of run $RUN at $SRC"
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}" "HEAD:refs/heads/claude/ci-i26-run2-out-${RUN}"
