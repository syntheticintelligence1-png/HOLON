# HOLON merge checks (docs/handoff/DEVIN.md §6) in parallel on GitHub-hosted runners.
# The toolchain is installed once, at the pins in config/holon.json (.github/ci/install_toolchain.sh,
# every download sha256-checked), cached, and restored by each check job. No secrets are used.
name: holon-ci

on:
  push:
    branches: [claude/holon-v2-bend2-c6z3cd, 'claude/ci-**']
  pull_request:
    branches: [claude/holon-v2-bend2-c6z3cd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holon-ci-${{ github.ref }}
  # every push to the integration branch keeps its own verdict; other refs cancel superseded runs
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/holon-v2-bend2-c6z3cd' }}

env:
  PYTHON_VERSION: '3.13.16'
  NODE_VERSION: '22.22.0'
  GO_VERSION: '1.24.7'
  BEND_NO_TELEMETRY: '1'

jobs:
  toolchain:
    name: toolchain (install + verify pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
      toolsets: ${{ steps.setskey.outputs.key }}
      toolsets_paths: ${{ steps.setskey.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache key from the pins
        id: key
        run: echo "key=holon-toolchain-v1-${{ hashFiles('config/holon.json', 'tools/install_bend.sh', '.github/ci/install_toolchain.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: restore
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Install the pinned toolchain
        if: steps.restore.outputs.cache-hit != 'true'
        run: bash .github/ci/install_toolchain.sh
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work

      # I103's toolchain sets (config/toolchains.json: solc_set, go_set) in a cache of their own, keyed on the set
      # file and its installer, so the main key above never moves for them (HUMAN_ANSWERS Q70). The paths come from
      # the config, mapped as link_paths.sh maps /root/.holon and /root/work. Only a job with `toolsets: true` restores it.
      - name: Cache key and paths of the I103 toolchain sets
        id: setskey
        run: |
          echo "key=holon-toolsets-v1-${{ hashFiles('config/toolchains.json', 'tools/install_toolchain_sets.sh') }}" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<HOLON_TOOLSETS_EOF"
            python3 -c "import json,os; c=json.load(open('config/toolchains.json')); h=os.environ['HOME']; m=lambda p: p.replace('/root/.holon', h+'/.holon').replace('/root/work', h+'/holon-work'); print(m(c['solc_set']['dir'])); [print(m(r['goroot'])) for v, r in sorted(c['go_set']['releases'].items()) if r.get('url')]"
            echo "HOLON_TOOLSETS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: setsrestore
        with:
          key: ${{ steps.setskey.outputs.key }}
          path: ${{ steps.setskey.outputs.paths }}
      - name: Install the I103 toolchain sets (every binary sha256-checked by the script)
        if: steps.setsrestore.outputs.cache-hit != 'true'
        run: bash tools/install_toolchain_sets.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.setsrestore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.setskey.outputs.key }}
          path: ${{ steps.setskey.outputs.paths }}
  check:
    name: ${{ matrix.name }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # one job per milestone with preregistered keys on the lead. M4 and M5 joined at M4's landing (PREREG OK on
          # the merged tree); M6 joined with its first key, I106 (an empty milestone fails by design: "an audit of nothing").
          - name: prereg-M2
            timeout: 30
            run: python -m holon audit prereg --milestone M2
          - name: prereg-M3
            timeout: 30
            run: python -m holon audit prereg --milestone M3
          - name: prereg-M4
            timeout: 30
            run: python -m holon audit prereg --milestone M4
          - name: prereg-M5
            timeout: 30
            run: python -m holon audit prereg --milestone M5
          - name: prereg-M6
            timeout: 30
            run: python -m holon audit prereg --milestone M6
          - name: tests-prereg
            # I1's prereg audit on synthetic histories (rules 1-6), and rule 6's parallel_outcome lines: a parallel
            # commit licensed one at a time when its files under K's outcome paths are another key's (I57/I56).
            timeout: 10
            run: python -m unittest tests_m2.test_prereg_order tests_m2.test_prereg_parallel -v
          - name: tests-m2-target-agnostic
            # AGENTS.md rule 2 and I6: no target identifier in generic code (the exhaustive scan of every holon/
            # module, audit M2/1 F-M2-14, and I6's generator grep), and a toy machine end to end through the same
            # generators, and I6's byte-identity pins of gen/M0-M1, the M0 and M1 records and their bindings (narrowed
            # by amendment for each later iteration's additions by design: I9, I14, I15, I16, I19, I24, I40, F35, I41).
            # Until #137 no CI job ran them: the scan had gone red unnoticed (holon/mutate, I62), and so had the
            # records and bindings pins (since I40 and F35).
            timeout: 30
            run: python -m unittest tests_m2.test_target_agnostic_exhaustive tests_m2.test_target_agnostic -v
          - name: freeze-check
            timeout: 15
            # the manifest's own sha256, pinned to the seed freeze (8a1dbe7): an edit of FROZEN.sha256 and
            # tools/freeze.py together still passes `check`, but not this pin, which only a reviewed change moves
            run: |
              python tools/freeze.py check
              test "$(python tools/freeze.py digest)" = "f854d69b0b58b581eb205a657d6925cc1e1460141ef9626df89ea87de1594fd0" || { echo "FROZEN.sha256 digest differs from the pinned seed freeze"; exit 1; }
          - name: frozen-suite
            timeout: 120
            run: HOLON_REPLAY=1 python -m unittest discover -s tests -t . -v
          - name: gate-M0
            timeout: 90
            run: python -m holon gate --milestone M0 --report "$RUNNER_TEMP/ci-out/gate_report_M0.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M0.json"
          - name: gate-M1
            timeout: 90
            run: python -m holon gate --milestone M1 --report "$RUNNER_TEMP/ci-out/gate_report_M1.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M1.json"
          - name: gate-M2
            timeout: 120
            run: python -m holon gate --milestone M2 --report "$RUNNER_TEMP/ci-out/gate_report_M2.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M2.json"
          - name: gate-M3-partial
            timeout: 120
            run: python -m holon gate --milestone M3 --checks G3,G5,G8,G9,G10,G11,G11V,GEVID --report "$RUNNER_TEMP/ci-out/gate_report_M3_partial.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M3_partial.json"
          - name: gate-M3-G7
            # I97 (F-M3-13): the second kernel on M3. G7 re-checks every decided M3 proof with BendTT (--verdict): the
            # I30 laws, every other decided law (PAR, Go, member laws) and the DISCH, FACT, contract and bundle laws, and
            # accepts a rejection only by a registered reason (spec/M3/lib/bendtt_constructs.json, with its repro). A
            # forged dual-kernel claim fails here. G4 (canaries) runs beside it, and G6 (I98): every REFUTED M3 record
            # bound to a passed replay of its family on the real code, by G6's own clauses (holon.replay_bind). Left
            # out, with the reason in docs/iterations/I97.md: G1, which regenerates every M3 output (models, corpora,
            # refinement, derivation) beyond a job's budget.
            timeout: 120
            run: python -m holon gate --milestone M3 --checks G7,G4,G6 --report "$RUNNER_TEMP/ci-out/gate_report_M3_G7.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M3_G7.json"
          - name: tests-m3-bendtt
            # I97: the classifier's registry and repro (B1-B3, B5) and F-M3-14's checks (TestAmendF14: no bunfig.toml or
            # .env* at any depth, the allowlisted checker environment, a foreign BENDTT refused by name, and round 4's
            # .env.local repro no longer flipping the verdict). The forged-tree check (B4) is gate-M3-G7's refusal path.
            timeout: 30
            run: python -m unittest tests_m3.test_bendtt_i97.TestAmendF14 tests_m3.test_bendtt_i97.TestBuild.test_r3_b1_the_repros_reproduce tests_m3.test_bendtt_i97.TestBuild.test_r4_b2_the_registry_and_classifier_name_no_target tests_m3.test_bendtt_i97.TestBuild.test_r5_b3_the_six_are_classified tests_m3.test_bendtt_i97.TestBuild.test_r7_b5_ci_runs_g7_on_m3 -v
          - name: tests-m3-g6
            # I98: G6's one rule with the final filter. A planted tree whose two REFUTED records lose their replay
            # entries fails G6 naming both, and the final filter takes both to UNKNOWN (TestBuild B1, B2); the
            # workflow runs G6 on M3 (B3); holon/replay_bind.py names no target (B4); at HEAD G6 passes exactly when
            # nothing is unbound (B5); every REFUTED M3 record is judged by a G6 clause (TestAmendAll A1).
            # The final filter is `holon refute --only filter`, which checks the pinned solver before any stage runs
            # (spec/M3/lib/refute.json solver); without it the command exits 2 and B2 fails (run 42607037319).
            timeout: 60
            extract: true
            run: python -m unittest tests_m3.test_g6_i98.TestBuild tests_m3.test_g6_i98.TestAmendAll.test_a1_every_refuted_record_is_judged -v
          - name: tests-m3-g9
            # I99 (audit M3/5 F-M3-19): G9 fails a record whose premises do not hold its law's assume clauses, one
            # string per clause. At HEAD G9 passes on M3 (B1); a planted premises [] on a PROVED 12-clause record and a
            # planted missing clause on a PROVED 4-clause record each fail G9, naming the law (B2, B3); the 13 records
            # the finding names have their premises (B4); this job runs the module (B5).
            timeout: 60
            run: python -m unittest tests_m3.test_g9_i99.TestBuild -v
          - name: tests-m3-audit
            # F-M3-27 (audit M3/6): a round that claims to count carries its evidence (spec/M3/lib/audit_evidence.json;
            # E1-E5, including the finding's own probe on its target), with the audit loop's own rules beside it: Q9b's
            # admission (Q1-Q4), Q42's plain-language rule approval (A1-A4), the M3 exit rulings (X1-X5), the M3 exit
            # record (X1-X6), and I87's rounds, convergence, gaps, coordinator, packet, oracle and honesty tests.
            # Left out: TestVacuity (P1 is I87's preregistered miss; R5 rebuilds round 1's a4.json with the checker).
            timeout: 30
            run: python -m unittest tests_m3.test_audit_evidence tests_m3.test_audit_q9b tests_m3.test_audit_q42 tests_m3.test_exit_rulings tests_m3.test_m3_exit tests_m3.test_audit_loop.TestRounds tests_m3.test_audit_loop.TestConverge tests_m3.test_audit_loop.TestGaps tests_m3.test_audit_loop.TestCoordinator tests_m3.test_audit_loop.TestPacket tests_m3.test_audit_loop.TestOracles tests_m3.test_audit_loop.TestHonesty -v
          - name: tests-m3-i101
            # I101 (audit M3/8-9: F-M3-37, F-M3-38, F-M3-42): a hollow round and each one-at-a-time content change to
            # round 9 refused by RD2 and not counted (B1-B2); the committed rounds valid, the status byte for byte (B3);
            # a changed packet does not rebuild (B4); the rendered prompts state Q9b's rule and the evidence (B5); a
            # subset run in a detached worktree deletes nothing and leaves summary.json and deps.json as committed (B6);
            # no target name in I101's holon/ lines (B7); these jobs (B8); no generator closure moves (B9).
            timeout: 30
            run: python -m unittest tests_m3.test_audit_fixes_i101.TestBuild -v
          - name: audit-M3-evidence
            # I101 (F-M3-37): the a4.json and packet.json of every round of M3's current streak, rebuilt from the
            # round's own target commit (holon audit vacuity|hostile --check), each byte for byte. The A1 and A2
            # records are not rebuilt: mutation --check and hostile-input --check are never run unattended.
            timeout: 60
            run: python -m holon audit evidence --milestone M3 --rebuild
          - name: tests-m3-i102
            # I102 (audit M3/2 F-M3-07, M3/7 F-M3-30): holon audit regress compares each commit with its own parents.
            # A synthetic history with a phantom change and a hidden one gives exactly its seven real changes, each
            # covered on its edge (B1), and the base's regress shows both failures on it (B2). Round 7's range: no
            # uncovered M3 change, and round 7's own hidden_check finds none unreported (B3). Round 2's range: no
            # uncovered M3 change (B4). No target name (B5), this job (B6), no generator closure moves (B7).
            timeout: 60
            run: python -m unittest tests_m3.test_regress_parents_i102.TestBuild -v
          - name: tests-m3-blind
            # I82 (= I46a): the blind pack, the comparison generator and the agreement metric (P1-P3, P5-P9) and the
            # regressions R0-R3. P4 is I82's documented miss (docs/iterations/I82.md: "missed in part") and is not run
            # here, as no key's measured outcome is. Added after I107's landing (HUMAN_ANSWERS Q67), with R1 narrowed to
            # I82's own commits (spec/M3/amendments/I82.jsonl).
            timeout: 30
            run: python -m unittest tests_m3.test_blind.TestPack.test_p1_the_bundle_holds_exactly_the_protocols_members tests_m3.test_blind.TestPack.test_p2_the_pack_is_byte_identical_across_runs_and_environments tests_m3.test_blind.TestPack.test_p3_the_whitepaper_is_redacted_as_the_protocol_says tests_m3.test_blind.TestMap tests_m3.test_blind.TestMetric tests_m3.test_blind.TestRegressions -v
          - name: tests-m6-i103
            # I103 (M6, frontend reach): the contracts F1-F6 (solc by pragma, the pinned sets in config/toolchains.json,
            # go by directive, the go.work main-module rule, the total sort pass) and the regressions R1-R5 (Morph moves
            # only by re-stamp, hand sidecars name their toolchain, pre-0.8 documents say unchecked, the coverage file
            # re-walked and complete). TestPredictions is the key's measured outcome and is not run here (P2 and P6 missed).
            timeout: 30
            run: python -m unittest tests_m6.test_i103_frontend_reach.TestSolcSelection tests_m6.test_i103_frontend_reach.TestGoSelection tests_m6.test_i103_frontend_reach.TestGoWork tests_m6.test_i103_frontend_reach.TestTotalSortPass tests_m6.test_i103_frontend_reach.TestRegressions -v
          - name: tests-m6-i105
            # I105 (M6, Go state machines): holon extract go_machines on the planted fixtures. Struct-field machines
            # (P1), havoc never drops a write (P2), the KV-store pattern (P3), byte-identical (P5), the existing
            # frontends unchanged (R1), guards keep every behaviour (TestGuardSoundness), and a Go machine through
            # sorts -> derive with DISCH laws (TestDemo). P4 and the corpus smoke measures P6-P8 are missed
            # predictions (docs/iterations/I105.md) and are not run here.
            timeout: 30
            run: python -m unittest tests_m6.test_i105_go_machines.TestStructMachines tests_m6.test_i105_go_machines.TestSoundness tests_m6.test_i105_go_machines.TestKVMachines tests_m6.test_i105_go_machines.TestDeterminism tests_m6.test_i105_go_machines.TestRegressions tests_m6.test_i105_go_machines.TestGuardSoundness tests_m6.test_i105_go_machines.TestDemo -v
          - name: tests-m6-i109
            # I109 (M6, pipeline totality pass 3): the Go rendering's types gaps A1-A4 (P1), the go-directive rule
            # (P2, both tests: the go 1.25.14 selection runs on I103's sets, restored from the toolchain job's sets cache
            # by `toolsets: true`, HUMAN_ANSWERS Q70), D9's SG1
            # (P3), Q61's opaque keys (P4), the recorded term budget (P5), Q60's constructor rule and Q64's default
            # (P6), Q62 (P7), remapped pragmas (f, not a prediction) and the regressions R1-R4. The corpus smoke
            # measures P8-P13 (results/M6/I109) are the key's measured outcome and are not run here.
            toolsets: true
            timeout: 30
            run: python -m unittest tests_m6.test_i109_pipeline_totality_3.TestTypesGaps tests_m6.test_i109_pipeline_totality_3.TestGoToolchain tests_m6.test_i109_pipeline_totality_3.TestSignedSign tests_m6.test_i109_pipeline_totality_3.TestStringKeys tests_m6.test_i109_pipeline_totality_3.TestTermBudget tests_m6.test_i109_pipeline_totality_3.TestNilMapDefault tests_m6.test_i109_pipeline_totality_3.TestNoLinkSidecar tests_m6.test_i109_pipeline_totality_3.TestRemappedPragmas tests_m6.test_i109_pipeline_totality_3.TestRegressions -v
          - name: tests-m6-i110
            # I110 (M6, the scale wall and the composed driver): the per-document sort budget B1-B4 (P2), the sort
            # outputs byte-identical under the speedups (P3), machines.nil_maps in go-machines' output (P1), the
            # composed driver's units (P6), the regressions R1-R3 and HUMAN_ANSWERS Q74/Q75's old-vs-new strategy check
            # (byte-identity on the coverage set, Morph and the planted documents; unit counts). The corpus and sealed measures (P4-P8,
            # results/M6/I110) are the key's measured outcome and are not run here.
            timeout: 30
            run: python -m unittest tests_m6.test_i110_scale_composed.TestSortBudget tests_m6.test_i110_scale_composed.TestByteIdentity tests_m6.test_i110_scale_composed.TestNilMapsRecorded.test_p1_go_machines_output_names_nil_maps tests_m6.test_i110_scale_composed.TestComposedUnits tests_m6.test_i110_scale_composed.TestRegressions tests_m6.test_i110_scale_composed.TestQ74SpeedupIdentity -v
          - name: tests-m6-i111
            # I111 (M6, types totality): (1) the per-document holon types fallback under types_fallback "opaque" (P1:
            # O1, O5-O7), its planted soundness fixtures (P2 a law over an opaque document alone, P3 a cross-document
            # milestone, P4 a law that holds only if the opaque state is constrained), a Go document's null coverage
            # field (P5) and the regressions (P6, R1); (2) the torsor-role search's decomposition D1: the planted
            # blow-up (P11) and HUMAN_ANSWERS Q74 (2) / Q75 old-versus-new byte identity and units (P12, P13). The
            # corpus and sealed measures (P7-P10, P14; results/M6/I111) are the key's measured outcome, not run here.
            timeout: 60
            run: python -m unittest tests_m6.test_i111_types_totality.TestFallback tests_m6.test_i111_types_totality.TestPlanted tests_m6.test_i111_types_totality.TestGoCoverage tests_m6.test_i111_types_totality.TestSearch tests_m6.test_i111_types_totality.TestSearchIdentity tests_m6.test_i111_types_totality.TestRegressions -v
          - name: tests-m6-i112
            # I112 (M6, the run wall): (1) the composed driver's per-runner routing (P1, P2) and the DISCH runner's
            # section errors as UNKNOWN (P3, a planted Go section error); (2) O1 widened to the refusal classes
            # gen_error, member_layout and unsupported, each in I111's three planted shapes (P4, P5), a milestone-wide
            # input error still a refusal (P6); (3) withhold() over gen/ and the run details and (4) the toolchain-set
            # preflight (P7); the regressions (P14, R1). The corpus and sealed measures (P8-P13; results/M6/I112) are
            # the key's measured outcome, not run here. Nothing here analyses a sealed target (Q56 (5)).
            timeout: 90
            run: python -m unittest tests_m6.test_i112_run_wall.TestRouting tests_m6.test_i112_run_wall.TestRoutingPlanted tests_m6.test_i112_run_wall.TestSectionErrors tests_m6.test_i112_run_wall.TestUnsupportedClass tests_m6.test_i112_run_wall.TestMemberLayoutClass tests_m6.test_i112_run_wall.TestMilestoneWide tests_m6.test_i112_run_wall.TestWithholdPreflight tests_m6.test_i112_run_wall.TestRegressions -v
          - name: tests-m6-i116
            # I116 (M6, per-document fallbacks): (D) a DISCH refusal for one document makes its DISCH laws UNKNOWN, a
            # recorded miss, every other document's DISCH running (P1, P2: planted Twice, in I111's three shapes); (E)
            # an evidence refusal for one adopted transitions document gives it no atom, a recorded miss, and derive
            # rebuilds the same set (P3, P4: planted Listed, three shapes); a milestone-wide input error stays a refusal
            # (P5); the same bytes without the opt-ins (P6); the regressions (P12, R1). The corpus and sealed measures
            # (P7-P11; results/M6/I116) are the key's measured outcome, not run here. Nothing here analyses a sealed
            # target (Q56 (5)).
            timeout: 90
            run: python -m unittest tests_m6.test_i116_per_document_fallbacks.TestDischUnit tests_m6.test_i116_per_document_fallbacks.TestDischShapes tests_m6.test_i116_per_document_fallbacks.TestEvidenceUnit tests_m6.test_i116_per_document_fallbacks.TestEvidenceShapes tests_m6.test_i116_per_document_fallbacks.TestMilestoneWide tests_m6.test_i116_per_document_fallbacks.TestBytes tests_m6.test_i116_per_document_fallbacks.TestRegressions -v
          - name: tests-m6-i118
            # I118 (M6, the post-derive walls): (C) the composed coverage stage walks only the extracted, typed
            # documents and lists the others as skipped (P1, P2: planted Guarded over its term budget and the opaque
            # Dyn, in I111's three shapes); (R) a runner failure confined to one document's laws makes them UNKNOWN
            # with the error, the rest decided (P3), a failure in every document stays a refusal (P4); (B) a bind
            # failure confined to one document unbinds its laws, the rest bound (P5), any other refuses (P6); (3) the
            # evidence schema's optional fallback (P7); the same bytes without the opt-ins (P8); the regressions (P13,
            # R1). The corpus and spent-target measures (P9-P12; results/M6/I118) are the key's measured outcome, not
            # run here. Nothing here analyses a sealed target (Q56 (5)).
            timeout: 90
            run: python -m unittest tests_m6.test_i118_post_derive_walls.TestCoverageUnit tests_m6.test_i118_post_derive_walls.TestCoverageShapes tests_m6.test_i118_post_derive_walls.TestRunShapes tests_m6.test_i118_post_derive_walls.TestRunMilestoneWide tests_m6.test_i118_post_derive_walls.TestBindShapes tests_m6.test_i118_post_derive_walls.TestBindMilestoneWide tests_m6.test_i118_post_derive_walls.TestEvidenceSchema tests_m6.test_i118_post_derive_walls.TestBytes tests_m6.test_i118_post_derive_walls.TestRegressions -v
          - name: tests-m6-i124
            # I124 (M6, the post-derive crashes; HUMAN_ANSWERS Q106, Q108): F-M6-06 the zero-cell carrier is Bend's []
            # (P1 unit; P2, P3 planted: the false laws REFUTED and replayed on real Go, the true law never REFUTED,
            # the class outside the model UNKNOWN); F-M6-07 a compile that fails for any recorded cause names it (P4)
            # and, under disch.section_errors "unknown", is confined to its document (P5; P6 without the opt-in, as
            # before); F-M6-08 a law whose model the run never generated is unbound, the rest bound as before (P7-P9);
            # the regressions (R1, R3). The corpus measures (P10-P12; results/M6/I124) are the key's measured outcome,
            # not run here. Nothing here analyses a sealed target (Q56 (5)).
            timeout: 60
            run: python -m unittest tests_m6.test_i124_post_derive_crashes.TestF06Unit tests_m6.test_i124_post_derive_crashes.TestF06Planted tests_m6.test_i124_post_derive_crashes.TestF07Unit tests_m6.test_i124_post_derive_crashes.TestF07Planted tests_m6.test_i124_post_derive_crashes.TestF08Planted tests_m6.test_i124_post_derive_crashes.TestMemoryRecord tests_m6.test_i124_post_derive_crashes.TestRegressions -v
          - name: tests-m6-i113
            # I113 (M6, the second sealed draw, HUMAN_ANSWERS Q86): the draw script (D1 standard library only, its test
            # vector; D2 the Q55 (2) pin rule), the candidate list and the key's sidecar pins (C1, K1), and the seal
            # (S1: spec/heldout3/commitment.json and the README's sealed state). TestReveal is red by design until the
            # reveal, which follows I114's prereg (Q54 (d)), so it is not run here. Nothing here reads a candidate.
            timeout: 10
            run: python -m unittest tests_m6.test_i113_sealed.TestDraw tests_m6.test_i113_sealed.TestCandidates tests_m6.test_i113_sealed.TestSeal -v
          - name: tests-m6-i115
            # I115 (M6, the binding wall): (1) the milestone runner's binding check (holon run --unbound unknown: a
            # law whose statement cannot be bound to its model is UNKNOWN, every other law decided; P1), the composed
            # route's bind stage (holon bind --unbound skip) and binding check over every family (P2, P4), the planted
            # mis-bound controls (P3); (2) Q87's go pins in the preflight (P5); the regressions (P6, P12, R1). The
            # corpus and sealed measures (P7-P11; results/M6/I115) are the key's measured outcome, not run here.
            # Nothing here analyses a sealed target (Q56 (5)).
            timeout: 60
            run: python -m unittest tests_m6.test_i115_binding_wall.TestUnbound tests_m6.test_i115_binding_wall.TestBind tests_m6.test_i115_binding_wall.TestBindingCheck tests_m6.test_i115_binding_wall.TestGoPins tests_m6.test_i115_binding_wall.TestRegressions -v
          - name: tests-m6-i117
            # I117 (M6, Go op semantics for the binding; HUMAN_ANSWERS Q90, Q91): (1) the differential test of
            # holon.gen.goint against the pinned go 1.24.7 (every edge case as real Go, the reference and the compiled
            # model compared; a sample checked by Bend, a planted wrong value rejected; P1); (2) the frontend's ops
            # "typed" and the reasoner control (P2); (3) the straight-line class on the planted package: the planted
            # false laws REFUTED and every REFUTED witness replayed as real Go, the true laws never refuted (P3), the
            # undefined op unbound and the field guards (P4); (4) Q91 (3), the mpipeline binding check before the
            # emitter (P5); the regressions (P6, R1). The corpus and sealed measures (P7-P11; results/M6/I117) are the
            # key's measured outcome, not run here. Nothing here analyses a sealed target (Q56 (5)).
            timeout: 60
            run: python -m unittest tests_m6.test_i117_go_op_semantics.TestSemantics tests_m6.test_i117_go_op_semantics.TestFrontend tests_m6.test_i117_go_op_semantics.TestPlanted tests_m6.test_i117_go_op_semantics.TestMpipelineBinding tests_m6.test_i117_go_op_semantics.TestRegressions -v
          - name: tests-m6-i119
            # I119 (M6, Go reasoner soundness; HUMAN_ANSWERS Q93 (1)): the planted package (tests_m6/fixtures/i119):
            # HUMAN_ANSWERS Q97: I119 lands (a) only; the tests of (b)'s default (TestFixture's default-mode checks,
            # TestDefault's flip checks) belong to I121, which re-applies (b), and are not run here.
            # the wraparound branch kept and the false in-bounds claim not made under the default (P1), confirmed on
            # the pinned go 1.24.7 (P2); the audit summary's counts and commitment, no law id (P4, P5; P3's
            # TestAudit.test_p3_morph_baseline_reproduces is a recorded miss, 7 of 8, and is not run here); the rule as the
            # default under every config version (P6); the regressions (P8). The audit's re-extraction of the corpus
            # is the key's measured outcome (results/M6/I119/audit.json), not run here. Nothing here analyses a
            # sealed target (Q56 (5)).
            timeout: 30
            run: python -m unittest tests_m6.test_i119_go_reasoner_soundness.TestFixture.test_p1_old_reading_recorded tests_m6.test_i119_go_reasoner_soundness.TestFixture.test_p1_control_unchanged tests_m6.test_i119_go_reasoner_soundness.TestDifferential tests_m6.test_i119_go_reasoner_soundness.TestAudit.test_audit_names_no_law tests_m6.test_i119_go_reasoner_soundness.TestAudit.test_audit_counts_are_per_milestone tests_m6.test_i119_go_reasoner_soundness.TestAudit.test_audit_corpus_covered tests_m6.test_i119_go_reasoner_soundness.TestAudit.test_audit_is_read_only tests_m6.test_i119_go_reasoner_soundness.TestDefault.test_p6_reasoner_unit tests_m6.test_i119_go_reasoner_soundness.TestDefault.test_p6_narrow_loop_mode_unchanged tests_m6.test_i119_go_reasoner_soundness.TestRegressions -v
          - name: tests-m6-i120
            # I120 (M6, route C reads beyond the store limit; HUMAN_ANSWERS Q93 (2)): the planted entry (I117's planted
            # Go package as a git entry) run end to end by holon eval holon's run_entry --compose: over a planted small
            # store_max_bytes under go.store_scope "commit", route C's laws are derived and the committed output holds
            # the document by sha256 and size only (P1); the same entry under the limit gives the same row and the same
            # committed bytes but the storage fields (P2); the control without the opt-in reproduces I117's wall (P3);
            # the storage rule as a unit (P4); the regressions (P10, R1). The corpus and sealed measures (P5-P9;
            # results/M6/I120) are the key's measured outcome, not run here. Nothing here analyses a sealed target.
            timeout: 60
            run: python -m unittest tests_m6.test_i120_route_c_full_documents.TestOverLimit tests_m6.test_i120_route_c_full_documents.TestEitherSide tests_m6.test_i120_route_c_full_documents.TestControl tests_m6.test_i120_route_c_full_documents.TestUnits tests_m6.test_i120_route_c_full_documents.TestRegressions -v
          - name: tests-m6-base
            # HUMAN_ANSWERS Q104 (1) and Q109 (F-M6-12): spec/M6/lib/base_run.json, the measured base, is
            # tools/base_protocol.py's output (B1); it loses no key of the root or of a landed protocol, empty dicts
            # included (B2); each value is the root's or a landed opt-in's (B3); the flattening keeps an empty dict (B4).
            timeout: 10
            run: python -m unittest tests_m6.test_base_protocol -v
          - name: tests-m6-i104
            # I104 (M6): holon roles. The contract R1-R6 (TestBuild: determinism and the committed Morph roles, evidence,
            # names as tie-breakers, the proposal channel and its model-free provenance, hand sidecars win, no target
            # name, M0-M3 re-stamp only) and predictions P1-P3 over results/M6/I104/. P4 (corpus smoke, 0 of 9 entries
            # derive a law) is a recorded miss (docs/iterations/I104.md) and is not run here.
            timeout: 30
            run: python -m unittest tests_m6.test_i104_roles.TestBuild tests_m6.test_i104_roles.TestPredictions.test_p1_morph_role_precision_recall tests_m6.test_i104_roles.TestPredictions.test_p2_m3_rederived tests_m6.test_i104_roles.TestPredictions.test_p3_planted_wrong_roles_are_never_findings -v
          - name: tests-m6-i108
            # I108 (M6, pipeline totality pass 2): the signed sort rules S1-S3 and their typed-model compilation (P1),
            # SYM per model in a multi-model milestone (P2), Go nil maps as UNKNOWN under the opt-in (P3), the layout
            # rules L1-L3 (P4), SP_b still refused (P5) and the regressions R1-R2. The corpus smoke measures P6-P10
            # (results/M6/I108) are the key's measured outcome and are not run here; P1's law count is a recorded miss.
            timeout: 30
            run: python -m unittest tests_m6.test_i108_pipeline_totality.TestSymPerModel tests_m6.test_i108_pipeline_totality.TestNilMaps tests_m6.test_i108_pipeline_totality.TestLayout tests_m6.test_i108_pipeline_totality.TestStringKeys tests_m6.test_i108_pipeline_totality.TestRegressions tests_m6.test_i108_pipeline_totality.TestSigned.test_p1_fixture_has_signed_terms tests_m6.test_i108_pipeline_totality.TestSigned.test_p1_sorts_03_records_signed_debt tests_m6.test_i108_pipeline_totality.TestSigned.test_p1_sorts_04_has_no_signed_debt -v
          - name: tests-m6-i107
            # I107 (M6 exit, the generality run): the protocol's contract (the run protocols are regenerated from the
            # landed base, scope rule G1, nil_maps "unknown", the protocol names its rules) and the regressions R1-R6
            # (Morph's outputs untouched, the Q56 disclosure shape, no hand target files, the summary regenerates, no
            # model identifiers, the reveal's commitment verified). TestPredictions is the key's measured outcome and is
            # not run here: P5-P7 are recorded misses and P8 is withheld (embargo), docs/iterations/I107.md. Nothing in
            # this job runs an analysis of a sealed target (Q56 (5)): it reads committed files only.
            timeout: 30
            run: python -m unittest tests_m6.test_i107_generality.TestProtocol tests_m6.test_i107_generality.TestRegressions -v
          - name: tests-m6-i106
            # I106 (M6, fresh sealed targets): the draw script and the candidates (R1), the seal (P1) and the reveal
            # (P2, with its independent recompute). Committed files only: no sealed target is analysed (Q56 (5)).
            # Added at the M6 exit (HUMAN_ANSWERS Q67: no test is left out of CI).
            timeout: 30
            run: python -m unittest tests_m6.test_i106_sealed -v
          - name: tests-m6-exit
            # The M6 exit record (docs/M6_EXIT.md): X1-X6 recomputed from committed files and the git history, and
            # the record's table and decision line checked against them (X7).
            timeout: 30
            run: python -m unittest tests_m6.test_m6_exit -v
          - name: tests-m3-par-record
            # I100 (rule PAR_record_round_trip): catalog holon-rules/1.16 (B1); the producer over the codec document is
            # the instrument's computation and gen/M3/par_record/basis.json its document (B2); an m08-like and an
            # m06-like plant obstruct, or shrink the family, as computed (B3); a conjunction decides by Bend, a planted
            # wrong constant REFUTED on that conjunct (B4); the back-test pairs L_rt_go_vN by the record map (B5); no
            # target name in the lines I100 adds under holon/ (B6); deterministic (B7); this job (B8). B0, the human's
            # admission, is TestAdmission and is not run here.
            timeout: 60
            run: python -m unittest tests_m3.test_par_record_i100.TestBuild -v
          - name: gate-M3-G2
            # F38: each gate re-runs only its own milestone's binding_change proofs in the two kernels, so M3's are
            # re-run here, once per CI run, in a job of their own (gate-M3-partial is red until G11V passes, Q36).
            # Pipeline v2 (E): under holon.kcache, the kernels' acceptance of a committed proof's exact bytes under
            # the pinned checker is remembered in the Actions cache (kcache below); a milestone exit re-checks
            # without it
            timeout: 90
            kcache: true
            run: python -m holon.kcache selftest && python -m holon.kcache --dir ~/.cache/holon-kcache -m holon gate --milestone M3 --checks G2 --report "$RUNNER_TEMP/ci-out/gate_report_M3_G2.json"
            report: "$RUNNER_TEMP/ci-out/gate_report_M3_G2.json"
          - name: tests-m3-catalog
            # F39: the catalog re-derivation bookkeeping on the real history (the registry tie, the lines the tool
            # generates, the typed bindings, and gate3's G2 on a clone); it re-runs M3's binding_change proofs once
            # (under holon.kcache, as gate-M3-G2)
            timeout: 120
            kcache: true
            run: python -m holon.kcache --dir ~/.cache/holon-kcache -m unittest tests_m3.test_catalog_rederivation -v
          - name: tests-m3-disch-r0
            # I96a: DISCH's R0 is derived from the binding's deployment record into spec/M3/lib/disch.json, outside
            # gen/M*/, so `holon land check` does not see a stale copy. The step's --check, its byte-identity, the
            # target-agnostic check, I31's yardstick and the brief run here.
            timeout: 30
            run: python -m unittest tests_m3.test_r0_i96a.TestBuild -v
          - name: tests-m3-refinement
            # I96b: the refinement hints and keys (results/M3/sorts/refinement/) and the fragments binding
            # (replay/M2/fragments.json) are derived from declared inputs, outside gen/M*/, so `holon land check` does not
            # see a stale or dropped copy. TestBuild runs `holon refinement --check` (about 9 minutes: a fresh R5 run
            # compared by sha256), `holon binding --fragments-out --check`, the leak check with its plant and the rest.
            timeout: 60
            run: python -m unittest tests_m3.test_hints_i96b.TestBuild -v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # prereg audit and G2 read the history
          persist-credentials: false  # the checks run repository code; they need no token
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Python requirements
        run: python -m pip install -q --require-hashes --no-deps -r .github/ci/requirements-ci.txt
      - name: Link the config's absolute paths
        run: bash .github/ci/link_paths.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ~/.bun
            ~/.holon
            ~/.elan
            ~/.bend
            ~/holon-work
      - name: Verify the pins
        run: python .github/ci/verify_toolchain.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: matrix.toolsets
        with:
          key: ${{ needs.toolchain.outputs.toolsets }}
          fail-on-cache-miss: true
          path: ${{ needs.toolchain.outputs.toolsets_paths }}
      # holon.kcache's entries (pipeline v2, E): written by workflow runs only; a pull request's run reads its base
      # branch's entries and writes its own scope. Each job saves a new key; a restore takes the newest match
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: matrix.kcache
        with:
          key: holon-kcache-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          restore-keys: holon-kcache-v1-
          path: ~/.cache/holon-kcache
      # the pinned z3 (hash-pinned wheels, tools/extract-requirements.txt) for a job that runs `holon refute`, which
      # refuses to run without it: installed as the re-make's apply job installs it (.github/ci/remake.template.yml)
      - name: The pinned z3
        if: matrix.extract
        run: bash tools/setup_env.sh --extract
      - name: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-out"
          set -o pipefail
          ${{ matrix.run }} 2>&1 | tee "$RUNNER_TEMP/ci-out/${{ matrix.name }}.log"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        # only acceptances are ever stored, so a failed check's entries are as good as a passing one's
        if: ${{ !cancelled() && matrix.kcache }}
        with:
          key: holon-kcache-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ~/.cache/holon-kcache
      - name: Test summary
        if: always() && (matrix.name == 'frozen-suite' || matrix.name == 'tests-m3-catalog')
        run: |
          grep -E '^(Ran [0-9]+ tests|OK|FAILED)' "$RUNNER_TEMP/ci-out/${{ matrix.name }}.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gate summary
        if: always() && matrix.report
        # the report is written by this run only (never the committed results/<m>/gate_report.json), so a
        # gate that crashed before writing it leaves the summary unreadable instead of showing a stale verdict
        run: python .github/ci/gate_summary.py "${{ matrix.report }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/ci-out/
